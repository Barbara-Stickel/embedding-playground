[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-playground"
version = "0.1.0"
description = "Hands-on experiments with text embeddings and classification."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "torch>=2.2",
    "transformers>=4.38",
]

[project.scripts]
embedding-playground = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["classifier", "embedding", "evaluation", "main", "processing"]
