data_processing:
  remove_misc: true
  split_data: random # timeseries # random
input: merchant_and_price # merchant_only
category: primary

classifier:
  name: nearest_neighbors
  options:
    n_neighbors: 10
    metric: cosine


model:
  name: mini
  batch_size: 32
  device: auto # Uses Apple MPS when available, otherwise CPU.

