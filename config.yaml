dataset:
  name: expenses
  file: data/expenses_training.csv
  input: merchant_and_price # merchant_only
  category: primary
  remove_misc: true
  split_data: random # timeseries # random
  test_size: 0.2
  seed: 42

evaluation:
  seeds: [42]
  max_incorrect_predictions: null # null shows all; 0 hides the table

embedding_cache:
  enabled: true
  directory: data/embeddings

classifier:
  name: nearest_neighbors
  options:
    n_neighbors: 10
    metric: cosine


model:
  name: mini
  batch_size: 32
  device: auto # Uses Apple MPS when available, otherwise CPU.

