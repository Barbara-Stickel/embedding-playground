dataset:
  name: hc3
  subset: all # finance, medicine, open_qa, reddit_eli5, wiki_csai
  # Defaults to the chosen subset's JSONL file on Hugging Face.
  # file: data/hc3/all.jsonl
  max_questions: null # null uses all question groups
  test_size: 0.2
  seed: 42
  balance_train: true # equal human/machine answers within each training question
  stratify_source: true # preserve source proportions in the question split

evaluation:
  # Use [42] for one run, or several seeds to compare selections:
  seeds: [42, 43, 44, 45, 46]
  max_incorrect_predictions: 0 # null shows all; 0 hides the table

embedding_cache:
  enabled: true
  directory: data/embeddings

classifier:
  name: nearest_neighbors
  options:
    n_neighbors: 10
    metric: cosine

model:
  name: mini
  batch_size: 32
  device: auto
