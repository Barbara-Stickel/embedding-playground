dataset:
  name: hc3
  subset: all # finance, medicine, open_qa, reddit_eli5, wiki_csai
  # Defaults to the chosen subset's JSONL file on Hugging Face.
  # file: data/hc3/all.jsonl
  max_questions: null # null uses all questions; all answers in each group are kept
  test_size: 0.2
  seed: 42

evaluation:

  max_incorrect_predictions: 50 # null shows all; 0 hides the table

embedding_cache:
  enabled: true
  directory: data/embeddings

classifier:
  name: nearest_neighbors
  options:
    n_neighbors: 10
    metric: cosine

model:
  name: mini
  batch_size: 32
  device: auto
