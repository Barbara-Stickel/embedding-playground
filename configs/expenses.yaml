dataset:
  name: expenses
  file: data/expenses_training.csv
  input: merchant_and_price # merchant_only
  category: primary # detailed
  remove_misc: true
  split_data: random # timeseries
  test_size: 0.2
  seed: 42

embedding_cache:
  enabled: true
  directory: data/embeddings

classifier:
  name: nearest_neighbors
  options:
    n_neighbors: 10
    metric: cosine

model:
  name: mini
  batch_size: 32
  device: auto
